[package]
name = "texturecraft-cli"
description = "Headless TextureCraft: info, run, batch, bake, export, render, MCP server, JSON-lines server"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"

[lib]
name = "texturecraft_cli"
path = "src/lib.rs"

[[bin]]
name = "texturecraft-cli"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
texturecraft-automation = { workspace = true }
texturecraft-engine = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
thiserror = { workspace = true }
clap = { workspace = true }

[dev-dependencies]
image = { workspace = true }
clap_complete = { workspace = true }
clap_mangen = { workspace = true }

[build-dependencies]
winresource = "0.1"
