name: TextureCraft unsigned nightly

# Automated daily schedule at 06:00 UTC plus supervised manual runs by reviewed manual actors.
on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unsigned:
    # Actual context guards only; no inherited/platform secrets.
    if: >-
      github.repository == 'storytold/texturecraft' &&
      github.ref == 'refs/heads/main' && github.ref_type == 'branch' &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    # Maximum for the reusable workflow. Its compiler narrows to contents/actions read;
    # no OIDC, attestation write, release environment or platform secrets in compilation.
    permissions:
      contents: read
      actions: read
      attestations: write
      id-token: write
    uses: storytold/craft-common-actions/.github/workflows/nightly-unsigned.yml@bf94b15b708089b95c4e2d1c978e66ecf1f2f4f3
    with:
      tooling-revision: bf94b15b708089b95c4e2d1c978e66ecf1f2f4f3
      app-name: texturecraft
      manual-actors: '["bflatastic","dylanmtaylor","echelon","FredApps","skylartaylor"]'
      craft-fonts-ref: aced4137c022f1f587624d48e81ec77e1914a9cc
      # One producer run builds every listed platform for one all-or-nothing release. The pin is the
      # craft-common-actions main commit that merged the exact-analysis admission (#371, after #370,
      # #369 and #364).
      platforms: '["windows-x86_64","linux-x86_64","macos-aarch64"]'
