# Flatpak manifest for TextureCraft, ready for a Flathub submission.
#
# Flatpak builds run offline, so the crate sources must be vendored first. From the repo root:
#
#   curl -fsSLO https://raw.githubusercontent.com/flatpak/flatpak-builder-tools/master/cargo/flatpak-cargo-generator.py
#   python3 flatpak-cargo-generator.py Cargo.lock -o packaging/linux/flatpak/cargo-sources.json
#   flatpak-builder --user --install --force-clean build-flatpak packaging/linux/flatpak/ai.storyteller.TextureCraft.yml
#   flatpak run ai.storyteller.texturecraft
#
# For Flathub, replace the `dir` source with a `git` source pinned to a release tag and commit.
# The single-file .flatpak attached to each release comes from ai.storyteller.TextureCraft.bundle.yml,
# which repackages the prebuilt release binaries. Keep runtime-version and finish-args identical.
id: ai.storyteller.texturecraft
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: texturecraft
finish-args:
  # Honor the launcher's pinned and nightly version choices before offering updates.
  - --filesystem=xdg-data/ArtCraft/versions:ro
  # Release checks and downloads use HTTPS.
  - --share=network
  # The shared updater inspects and updates this installation via flatpak-spawn --host.
  - --talk-name=org.freedesktop.Flatpak
  # Display: Wayland first; X11 only when no Wayland compositor is running.
  - --socket=wayland
  - --socket=fallback-x11
  # X11 shared memory (MIT-SHM). Without it the X11 fallback is slow or fails.
  - --share=ipc
  # GPU access for the wgpu viewport (Vulkan, or GL as a fallback).
  - --device=dri
  # Open/Save dialogs go through the file-chooser portal (rfd's xdg-portal backend) and
  # drag-and-drop through the document portal, so picked files work anywhere without broad
  # filesystem access. Pictures and Documents are granted so files passed by path (the command
  # line, Open Recent, "Save" next to the original) work in the usual places.
  - --filesystem=xdg-pictures
  - --filesystem=xdg-documents
build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
modules:
  - name: texturecraft
    buildsystem: simple
    build-options:
      env:
        CARGO_HOME: /run/build/texturecraft/cargo
        CARGO_NET_OFFLINE: 'true'
    build-commands:
      - cargo --offline build --release --locked -p texturecraft -p texturecraft-cli
      - install -Dm755 target/release/texturecraft /app/bin/texturecraft
      - install -Dm755 target/release/texturecraft-cli /app/bin/texturecraft-cli
      - install -Dm644 packaging/linux/ai.storyteller.texturecraft.desktop /app/share/applications/ai.storyteller.texturecraft.desktop
      - install -Dm644 packaging/linux/ai.storyteller.texturecraft.mime.xml /app/share/mime/packages/ai.storyteller.texturecraft.xml
      - mkdir -p /app/share/icons && cp -R assets/app-icon/hicolor /app/share/icons/
      - >-
        version=$(awk '/^\[/{p=($0=="[workspace.package]");next} p&&$1=="version"{gsub(/[" ]/,"",$3);print $3;exit}' Cargo.toml);
        install -d /app/share/metainfo;
        sed -e "s/@VERSION@/$version/" -e "s/@DATE@/$(date -u +%Y-%m-%d)/"
        packaging/linux/ai.storyteller.texturecraft.metainfo.xml.in > /app/share/metainfo/ai.storyteller.texturecraft.metainfo.xml
    sources:
      - type: dir
        path: ../../..
        skip:
          - target
          - dist
          - build-flatpak
          - .flatpak-builder
      - cargo-sources.json
