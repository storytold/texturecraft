[package]
name = "texturecraft-engine"
description = "TextureCraft session, command registry, painting, baking and inspection"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
chrono = { workspace = true }
texturecraft-core = { workspace = true }
texturecraft-texel = { workspace = true }
texturecraft-geom = { workspace = true }
texturecraft-compose = { workspace = true }
texturecraft-paint = { workspace = true }
texturecraft-bake = { workspace = true }
texturecraft-formats = { workspace = true }
texturecraft-import = { workspace = true }
texturecraft-import-verify = { workspace = true }
rayon = { workspace = true }
epaint_default_fonts = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
web-time = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tempfile = "3"
# Graph cooks kept in a folder across imports (file.importProject `resultCache`); the web build has no folder.
texturecraft-result-cache = { workspace = true }

[target.'cfg(any(target_os = "macos", target_os = "freebsd"))'.dependencies]
sysinfo = { workspace = true }

[target.'cfg(windows)'.dependencies]
processkit = { version = "3.3.4", default-features = false, features = ["limits"] }
tokio = { workspace = true }

[target.'cfg(unix)'.dependencies]
rustix = { workspace = true }

[dev-dependencies]
image = { workspace = true }
zip = { workspace = true }

[features]
# Developer tools in examples/ that read local project files. Off by default, so `cargo test` (the CI gate) does
# not build them; run one with `cargo run -p texturecraft-engine --features dev-tools --example <name> -- ...`.
dev-tools = []

[[example]]
name = "import_progress"
required-features = ["dev-tools"]
