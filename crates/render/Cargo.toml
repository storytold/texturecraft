[package]
name = "texturecraft-render"
description = "TextureCraft wgpu viewport renderer: PBR, image-based lighting, debug views, UV view"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
# Other crates' tests: `Headless::for_tests` shares one device and its compiled pipelines per
# process on software adapters, as the render crate's own tests do
test-support = []

[dependencies]
texturecraft-core = { workspace = true }
texturecraft-texel = { workspace = true }
texturecraft-geom = { workspace = true }
texturecraft-paint = { workspace = true }
texturecraft-compose = { workspace = true }
wgpu = { workspace = true }
bytemuck = { workspace = true }
half = { workspace = true }
log = { workspace = true }
rayon = { workspace = true }
serde = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
craft-material-graph-wgpu = { workspace = true }
texturecraft-bake = { workspace = true }
pollster = "0.4"

# The browser's WebGPU resolves error scopes later: their results are awaited on the page.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = "0.4"

[dev-dependencies]
image = { workspace = true }
# The version wgpu uses: checks the composite and neighbourhood WGSL and its GLSL output without an adapter
naga = { version = "30.0.1", features = ["wgsl-in", "glsl-out"] }
