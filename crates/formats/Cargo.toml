[package]
name = "texturecraft-formats"
description = "TextureCraft file formats: mesh import (glTF, FBX, COLLADA, USD, OBJ, PLY, STL), glTF/USD/OBJ mesh export, texture export presets, the .tcraft project file"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
craft-usd.workspace = true
# ICC v2 serialization prerequisite: craft-libs#1735; app colour policy stays local.
craft-cms-icc-v2 = { package = "craft-cms", version = "0.1.0", git = "https://github.com/storytold/craft-libs", rev = "272a095b61257917693da3d09f2f8ecccd7f0295" }
craft-materialx = { workspace = true }
craft-mesh = { workspace = true }
craft-mcmat = { workspace = true }
craft-tcraft = { workspace = true }
craft-zip = { workspace = true }
craft-zip-usdz = { workspace = true }
texturecraft-core = { workspace = true }
texturecraft-texel = { workspace = true }
texturecraft-geom = { workspace = true }
texturecraft-compose = { workspace = true }
image = { workspace = true }
png = "0.18"
bytemuck = { workspace = true, features = ["extern_crate_alloc"] }
craft-image-codecs = { workspace = true }
craft-psd = { git = "https://github.com/storytold/craft-libs", rev = "b130ac1fa44f923c3024884ab8ceb5ccdb88f15f" }
gltf = { workspace = true }
flate2 = { workspace = true }
lz4_flex = { workspace = true }
half = { workspace = true }
quick-xml = { workspace = true }
zip = { workspace = true }
exr = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
rayon = { workspace = true }
base64 = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
sysinfo = { workspace = true }
